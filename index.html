<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT INTERNATIONAL ACADEMY TV</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #0b0b0b; color: white; font-family: sans-serif; text-align: center; overflow-x: hidden; }
        .header { padding: 12px; background: #000; border-bottom: 2px solid #ff0000; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .logo-box { height: 35px; width: 35px; background: #222; border: 1px solid #444; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 8px; color: #888; }
        .header-text { font-weight: bold; font-size: 1rem; letter-spacing: 1px; }
        .video-container { position: relative; width: 100%; max-width: 900px; margin: 0 auto; background: #000; }
        video { width: 100%; height: auto; display: block; }
        #ad-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; display: none; z-index: 1000; }
        .info { padding: 15px; }
        .whatsapp-btn { display: inline-flex; align-items: center; background: #25D366; color: white; padding: 8px 18px; border-radius: 25px; text-decoration: none; font-weight: bold; font-size: 0.8rem; margin-top: 10px; }
        #admin-panel { display: none; position: fixed; top: 50px; left: 5%; width: 90%; background: #1a1a1a; padding: 20px; border: 2px solid #ff0000; z-index: 2000; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        input { width: 90%; padding: 10px; margin: 10px 0; background: #333; border: 1px solid #555; color: white; border-radius: 5px; }
        button { background: #ff0000; color: white; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="ad-overlay"><video id="ad-player" playsinline></video></div>

    <div class="header">
        <div class="logo-box">LOGO</div>
        <div class="header-text">IT INTERNATIONAL ACADEMY TV</div>
    </div>

    <div class="video-container">
        <video id="main-player" controls playsinline autoplay muted loop></video>
    </div>

    <div class="info">
        <div style="color: #ff0000; font-size: 0.8rem; font-weight: bold;">📺 LIVE BROADCAST</div>
        <a href="https://wa.me/260766149405" class="whatsapp-btn">💬 WhatsApp Admin</a>
    </div>

    <div id="admin-panel">
        <h3>Admin Dashboard</h3>
        <input type="text" id="new-video" placeholder="New Lesson MP4 Link">
        <input type="text" id="ad-link" placeholder="8-20s Ad MP4 Link">
        <button onclick="updateSystem()">Update Station</button>
        <button onclick="closeAdmin()" style="background:#444; margin-top:10px;">Close</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCMTsYMsXuH55f18t...",
            authDomain: "ita-tv-db475.firebaseapp.com",
            projectId: "ita-tv-db475",
            databaseURL: "https://ita-tv-db475-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Listen for changes
        db.ref('station').on('value', (snapshot) => {
            const data = snapshot.val();
            if(data) document.getElementById('main-player').src = data.mainVideo;
        });

        // Ad Interrupt Logic
        function playAd(link) {
            const adOverlay = document.getElementById('ad-overlay');
            const adPlayer = document.getElementById('ad-player');
            adPlayer.src = link;
            adOverlay.style.display = 'block';
            adPlayer.play();
            adPlayer.onended = () => { adOverlay.style.display = 'none'; };
        }

        // Secret Login (Type 'admin' in console or we can add a button)
        window.addEventListener('keydown', (e) => {
            if(e.key === 'F2') { // Pressing F2 or a secret combination
                const id = prompt("Admin ID:");
                const pass = prompt("Password:");
                if(id === 'admin' && pass === 'admin123') document.getElementById('admin-panel').style.display = 'block';
            }
        });

        function updateSystem() {
            const mainV = document.getElementById('new-video').value;
            db.ref('station').update({ mainVideo: mainV });
            alert("Station Updated!");
        }
        function closeAdmin() { document.getElementById('admin-panel').style.display = 'none'; }
    </script>
</body>
</html>
